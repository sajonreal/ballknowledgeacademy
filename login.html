<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#fff7fb">
<title>Iniciar sesión · Ballknowledge Academy</title><link rel="stylesheet" href="style.css"><link rel="apple-touch-icon" href="images/icon-180.png"><link rel="icon" href="images/icon-180.png">
<script src="data.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="auth-core.js"></script><script src="login.js" defer></script>
</head><body class="login-page"><div class="bg-decor"><div class="wave-layer one"></div><div class="wave-layer two"></div><span class="bg-heart h1">♥</span><span class="bg-heart h2">♥</span><span class="bg-heart h3">♥</span><span class="bg-heart h4">♥</span><span class="bg-heart h5">♥</span></div>
<main class="login-shell"><div class="login-brand">🎓 Ballknowledge Academy</div><p class="login-tagline">Aunque aún no encuentres tus palabras, sigue escribiendo</p>
<img class="login-image" src="images/login-imagen.png" alt="" onerror="this.style.display='none'">
<section class="login-card-standalone"><h2>¡Qué alegría verte!</h2><p class="login-subtitle">Inicia sesión para entrar en la academia</p>
<form id="login-form"><label for="login-usuario">Usuario</label><input type="text" id="login-usuario" name="username" placeholder="Tu nombre de usuario" autocomplete="username" required>
<label for="login-clave">Contraseña</label><input type="password" id="login-clave" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
<button type="submit" id="login-submit">Entrar</button><p class="login-error-standalone" id="login-error" role="alert" aria-live="polite"></p></form></section>
<p class="login-footer">Un pequeño rincón para nuestras historias, notas y animes 💗</p></main></body></html>
