<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reseñas · Ballknowledge Academy</title>
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="icon" href="images/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Ballknowledge Academy">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <div class="bg-decor">
    <div class="wave-layer one"></div>
    <div class="wave-layer two"></div>
    <span class="bg-heart h1">♥</span>
    <span class="bg-heart h2">♥</span>
    <span class="bg-heart h3">♥</span>
    <span class="bg-heart h4">♥</span>
    <span class="bg-heart h5">♥</span>
  </div>

  <header class="top-bar"><span class="logo">🎓 Ballknowledge Academy</span></header>

  <div class="page-header reveal">
    <h1>📝 Reseñas</h1>
    <p>Solo los animes que hemos escalado nosotros, con su desglose completo</p>
  </div>

  <div class="buscador-wrap">
    <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar anime por nombre...">
  </div>

  <button class="orden-toggle" id="btn-orden">Ordenar: mejor nota primero ⇅</button>

  <div class="resenas-lista" id="lista-resenas"></div>

  <footer class="espaciador"></footer>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icono">🏠</span>Inicio</a>
    <a href="resenas.html"><span class="icono">📝</span>Reseñas</a>
    <a href="planeados.html"><span class="icono">📌</span>Planeados</a>
    <a href="calendario.html"><span class="icono">📆</span>Calendario</a>
    <a href="ruleta.html"><span class="icono">🎰</span>Ruleta</a>
    <a href="listas.html"><span class="icono">🎧</span>Listas</a>
  </nav>

  <!-- Formulario de valoración (oculto hasta que se abre) -->
  <div class="valorar-overlay" id="valorar-overlay">
    <div class="valorar-card">
      <h2 id="valorar-titulo">Valorar anime</h2>
      <p class="valorar-sub" id="valorar-sub"></p>

      <div class="valorar-grid" id="valorar-grid"></div>

      <div class="valorar-final">
        <label for="valorar-final-input">🏁 Nota final</label>
        <input type="number" id="valorar-final-input" min="1" max="10" step="0.5">
      </div>

      <div class="valorar-botones">
        <button type="button" class="valorar-cancelar" id="valorar-cancelar">Cancelar</button>
        <button type="button" class="valorar-guardar" id="valorar-guardar">💾 Guardar valoración</button>
      </div>
      <p class="valorar-nota-envio">Se guarda al momento — la media se actualiza en cuanto pulses aquí.</p>
    </div>
  </div>

  <!-- Panel para ver las notas de los dos usuarios -->
  <div class="valorar-overlay" id="vernotas-overlay">
    <div class="valorar-card">
      <h2 id="vernotas-titulo">Notas de los usuarios</h2>
      <div id="vernotas-contenido"></div>
      <div class="valorar-botones">
        <button type="button" class="valorar-cancelar" id="vernotas-cerrar" style="width:100%;">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
  <script>
    let ordenAscendente = false;
    let terminoBusqueda = "";
    let animeEnEdicion = null;

    function valorOrden(anime) {
      const n = calcularNotasFinales(anime).nota;
      return n === null || n === undefined ? Infinity : n;
    }

    function pintarResenas() {
      const cont = document.getElementById("lista-resenas");
      cont.innerHTML = "";

      const filtrada = ANIME_COMPLETADOS.filter(a =>
        a.nombre.toLowerCase().includes(terminoBusqueda)
      );

      const lista = [...filtrada].sort((a, b) => {
        const diff = valorOrden(b) - valorOrden(a);
        return ordenAscendente ? -diff : diff;
      });

      if (!lista.length) {
        cont.innerHTML = `<div class="empty-state">No hay ninguna reseña que coincida con "${terminoBusqueda}".</div>`;
        return;
      }

      const usuarioActual = getUsuarioActual();

      lista.forEach(anime => {
        const { nota, subnotas } = calcularNotasFinales(anime);

        const card = document.createElement("div");
        card.className = "resena-card reveal";

        const media = document.createElement("div");
        media.className = "resena-media";
        const img = document.createElement("img");
        img.src = anime.imagen;
        img.alt = anime.nombre;
        img.loading = "lazy";
        img.onerror = () => {
          media.classList.add("img-fallback");
          media.innerHTML = `<span class="img-fallback-letra">${anime.nombre.charAt(0).toUpperCase()}</span>`;
        };
        media.appendChild(img);
        card.appendChild(media);

        const body = document.createElement("div");
        body.className = "resena-body";

        const top = document.createElement("div");
        top.className = "resena-top";

        const notaTexto = (nota === null || nota === undefined) ? "?" : nota;
        top.innerHTML = `
          <h3>${anime.nombre}</h3>
          <div class="nota-final-box">
            <span class="nfb-label">Nota final</span>
            <span class="nfb-value">⭐ ${notaTexto}</span>
          </div>
        `;
        body.appendChild(top);

        const grid = document.createElement("div");
        grid.className = "stat-grid";
        ESTADISTICAS.forEach(stat => {
          const valor = subnotas ? subnotas[stat.key] : null;
          const valorTexto = (valor === null || valor === undefined) ? "?" : valor;
          const chip = document.createElement("div");
          chip.className = "stat-chip";
          chip.innerHTML = `<span class="sc-emoji">${stat.emoji}</span><span class="sc-label">${stat.label}</span><span class="sc-value">${valorTexto}</span>`;
          grid.appendChild(chip);
        });
        body.appendChild(grid);

        // Botones de valoración personal
        const yaValorado = anime.notasUsuarios && anime.notasUsuarios[usuarioActual];
        const accionesWrap = document.createElement("div");
        accionesWrap.className = "valorar-acciones";

        if (yaValorado) {
          const btnCambiar = document.createElement("button");
          btnCambiar.className = "mini-accion-btn";
          btnCambiar.textContent = "✏️ Cambiar valoración";
          btnCambiar.addEventListener("click", () => abrirFormularioValoracion(anime));

          const btnVer = document.createElement("button");
          btnVer.className = "mini-accion-btn";
          btnVer.textContent = "👀 Ver notas de los usuarios";
          btnVer.addEventListener("click", () => abrirVerNotas(anime));

          accionesWrap.appendChild(btnCambiar);
          accionesWrap.appendChild(btnVer);
        } else {
          const btnValorar = document.createElement("button");
          btnValorar.className = "mini-accion-btn destacado";
          btnValorar.textContent = "⭐ Valorar este anime";
          btnValorar.addEventListener("click", () => abrirFormularioValoracion(anime));
          accionesWrap.appendChild(btnValorar);
        }

        body.appendChild(accionesWrap);
        card.appendChild(body);
        cont.appendChild(card);
      });

      activarRevelados();
    }

    /* ---------------- Formulario de valoración ---------------- */
    function abrirFormularioValoracion(anime) {
      animeEnEdicion = anime;
      const usuarioActual = getUsuarioActual();
      const notaPrevia = (anime.notasUsuarios && anime.notasUsuarios[usuarioActual]) || {};

      document.getElementById("valorar-titulo").textContent = `Valorar: ${anime.nombre}`;
      document.getElementById("valorar-sub").textContent = `Valorando como ${usuarioActual}`;

      const grid = document.getElementById("valorar-grid");
      grid.innerHTML = "";
      ESTADISTICAS.forEach(stat => {
        const campo = document.createElement("div");
        campo.className = "valorar-campo";
        const valorPrevio = notaPrevia[stat.key] ?? "";
        campo.innerHTML = `
          <label for="v-${stat.key}">${stat.emoji} ${stat.label}</label>
          <input type="number" id="v-${stat.key}" min="1" max="10" step="0.5" value="${valorPrevio}">
        `;
        grid.appendChild(campo);
      });

      document.getElementById("valorar-final-input").value = notaPrevia.final ?? "";
      document.getElementById("valorar-overlay").classList.add("visible");
    }

    function cerrarFormularioValoracion() {
      document.getElementById("valorar-overlay").classList.remove("visible");
      animeEnEdicion = null;
    }

    async function guardarYEnviarValoracion() {
      if (!animeEnEdicion) return;
      const usuarioActual = getUsuarioActual();

      const valores = {};
      let huecos = false;
      ESTADISTICAS.forEach(stat => {
        const input = document.getElementById(`v-${stat.key}`);
        const v = input.value.trim();
        if (v === "") { huecos = true; return; }
        valores[stat.key] = Number(v);
      });
      const finalInput = document.getElementById("valorar-final-input");
      if (finalInput.value.trim() === "") huecos = true;
      else valores.final = Number(finalInput.value);

      if (huecos || Object.values(valores).some(v => v < 1 || v > 10)) {
        alert("Rellena todas las casillas con un número entre 1 y 10.");
        return;
      }

      const boton = document.getElementById("valorar-guardar");
      boton.disabled = true;
      boton.textContent = "Guardando...";

      try {
        await guardarNotaUsuarioFirebase(animeEnEdicion.nombre, usuarioActual, valores);
        cerrarFormularioValoracion();
        await cargarNotasUsuariosYAplicar();
        pintarResenas();
      } catch (err) {
        alert("No se ha podido guardar: " + err.message);
      } finally {
        boton.disabled = false;
        boton.textContent = "💾 Guardar valoración";
      }
    }

    document.getElementById("valorar-cancelar").addEventListener("click", cerrarFormularioValoracion);
    document.getElementById("valorar-guardar").addEventListener("click", guardarYEnviarValoracion);

    /* ---------------- Ver notas de los usuarios ---------------- */
    function abrirVerNotas(anime) {
      document.getElementById("vernotas-titulo").textContent = `Notas de: ${anime.nombre}`;
      const cont = document.getElementById("vernotas-contenido");
      cont.innerHTML = "";

      const usuarios = anime.notasUsuarios || {};
      const nombres = Object.keys(usuarios);

      if (!nombres.length) {
        cont.innerHTML = `<p class="valorar-sub">Todavía no hay notas guardadas.</p>`;
      } else {
        nombres.forEach(nombreUsuario => {
          const datos = usuarios[nombreUsuario];
          const bloque = document.createElement("div");
          bloque.className = "vernotas-usuario";
          bloque.innerHTML = `
            <h4>${nombreUsuario}</h4>
            <div class="stat-grid">
              ${ESTADISTICAS.map(stat => {
                const v = datos[stat.key];
                const texto = (v === null || v === undefined) ? "?" : v;
                return `<div class="stat-chip"><span class="sc-emoji">${stat.emoji}</span><span class="sc-label">${stat.label}</span><span class="sc-value">${texto}</span></div>`;
              }).join("")}
              <div class="stat-chip"><span class="sc-emoji">🏁</span><span class="sc-label">Nota final</span><span class="sc-value">${datos.final ?? "?"}</span></div>
            </div>
          `;
          cont.appendChild(bloque);
        });
      }

      document.getElementById("vernotas-overlay").classList.add("visible");
    }

    document.getElementById("vernotas-cerrar").addEventListener("click", () => {
      document.getElementById("vernotas-overlay").classList.remove("visible");
    });

    /* ---------------- Filtros y orden ---------------- */
    document.getElementById("btn-orden").addEventListener("click", (e) => {
      ordenAscendente = !ordenAscendente;
      e.target.textContent = ordenAscendente ? "Ordenar: peor nota primero ⇅" : "Ordenar: mejor nota primero ⇅";
      pintarResenas();
    });

    document.getElementById("buscador").addEventListener("input", (e) => {
      terminoBusqueda = e.target.value.trim().toLowerCase();
      pintarResenas();
    });

    (async () => {
      pintarResenas(); // se ve algo al instante con los valores fijos de data.js
      await cargarNotasUsuariosYAplicar(); // y en cuanto llegan los de Firebase, se repinta
      pintarResenas();
    })();
  </script>
</body>
</html>
